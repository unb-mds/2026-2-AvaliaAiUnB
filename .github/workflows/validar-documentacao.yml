name: Validar documentacao

on:
  pull_request:
    paths:
      - "README.md"
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/validar-documentacao.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar-mkdocs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Instalar dependencias
        run: pip install "mkdocs>=1.6,<2" "mkdocs-material>=9.5,<10"
      - name: Validar a documentacao
        run: mkdocs build --strict
