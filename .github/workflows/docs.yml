name: Documentacao

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publicar:
    if: github.repository == 'unb-mds/2026-2-AvaliaAiUnB'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install "mkdocs>=1.6,<2" "mkdocs-material>=9.5,<10"
      - run: mkdocs gh-deploy --force