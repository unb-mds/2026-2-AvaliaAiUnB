<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AvaliaAi - Início</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='base.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='index.css') }}">
</head>
<body>
    {% include '_topo.html' %}

    <main class="conteudo">
        <h1>Bem-vindo ao AvaliaAi</h1>
        <p class="apresentacao">A plataforma para consulta e avaliação de professores e disciplinas da UNB.</p>

        <nav class="acoes" aria-label="Acesso rápido">
            <a href="/professores" class="acao acao-principal">
                <svg class="acao-icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                    <circle cx="11" cy="11" r="7"></circle>
                    <path d="m20 20-3.5-3.5"></path>
                </svg>
                <span class="acao-titulo">Consulta de Professores</span>
                <span class="acao-texto">Busque por nome, disciplina ou departamento e veja as médias.</span>
            </a>
            <a href="{{ url_for('professores.ranking') }}" class="acao">
                <svg class="acao-icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                    <path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4Z"></path>
                    <path d="M7 6H4v2a3 3 0 0 0 3 3M17 6h3v2a3 3 0 0 1-3 3"></path>
                </svg>
                <span class="acao-titulo">Ranking de Professores</span>
                <span class="acao-texto">Confira os professores mais bem avaliados.</span>
            </a>
        </nav>
    </main>
</body>
</html>
