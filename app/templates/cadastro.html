<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cadastro - AvaliaAi UnB</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 400px; margin: 60px auto; padding: 0 20px; }
        h1 { font-size: 1.4rem; }
        label { display: block; margin-top: 12px; font-size: 0.9rem; }
        input { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; }
        button { margin-top: 20px; padding: 10px 16px; cursor: pointer; }
        p.link { margin-top: 16px; font-size: 0.9rem; }
    </style>
</head>
<body>
    <h1>Criar conta</h1>

    {% set dados = dados|default({}) %}
    {% set erros = erros|default({}) %}
    {% if erros %}
    <ul role="alert" style="color: #a01818;">{% for erro in erros.values() %}<li>{{ erro }}</li>{% endfor %}</ul>
    {% endif %}
    {% if sucesso %}<p role="status">{{ sucesso }} <a href="/login">Entrar</a></p>{% endif %}

    <form action="/cadastro" method="POST">
        <input type="hidden" name="formato" value="html">
        <label for="nome">Nome</label>
        <input type="text" id="nome" name="nome" value="{{ dados.get('nome', '') }}" autocomplete="name" required>

        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" value="{{ dados.get('email', '') }}" autocomplete="email" required>

        <label for="senha">Senha</label>
        <input type="password" id="senha" name="senha" minlength="8" autocomplete="new-password" aria-describedby="senha-ajuda" required>

        <p id="senha-ajuda">Use pelo menos 8 caracteres.</p>
        <label for="confirmar_senha">Confirmar senha</label>
        <input type="password" id="confirmar_senha" name="confirmar_senha" minlength="8" autocomplete="new-password" required>

        <button type="submit">Cadastrar</button>
    </form>

    <p class="link">Já tem conta? <a href="/login">Entrar</a></p>
</body>
</html>
