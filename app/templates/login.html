<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AvaliaAi UnB</title>
    <style>
    * {
        box-sizing: border-box;
    }

    body {
        font-family: Arial, sans-serif;
        max-width: 400px;
        margin: 60px auto;
        padding: 0 20px;
    }

    h1 {
        font-size: 1.4rem;
    }

    label {
        display: block;
        margin-top: 12px;
        font-size: 0.9rem;
    }

    input {
        width: 100%;
        padding: 10px;
        margin-top: 4px;
        border: 1px solid #ccc;
        border-radius: 4px;
    }

    button {
        margin-top: 20px;
        padding: 10px 16px;
        cursor: pointer;
        width: 100%;
        border: none;
        border-radius: 4px;
    }

    p.link {
        margin-top: 16px;
        font-size: 0.9rem;
        text-align: center;
    }

    @media (max-width: 480px) {
        body {
            margin: 30px auto;
            padding: 0 16px;
        }

        h1 {
            font-size: 1.3rem;
        }

        input,
        button {
            font-size: 1rem;
        }
    }
</style>
