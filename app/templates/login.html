<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar - AvaliaUnb</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='base.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='auth.css') }}">
</head>
<body>
<main class="auth card">
    <p class="voltar"><a href="{{ url_for('main.index') }}">&larr; Início</a></p>
    <h1>Entrar</h1>

    {% if erro %}
    <p class="erro-login mensagem mensagem-erro" role="alert">{{ erro }}</p>
    {% endif %}

    <p class="descricao-auth">Use sua conta Google para entrar. No primeiro acesso, sua conta no AvaliaUnb é criada automaticamente.</p>

    <a class="botao botao-primario botao-google" href="{{ url_for('auth.login_google') }}">Entrar com Google</a>
</main>
{% include '_rodape.html' %}
</body>
</html>
