<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 564" width="400" height="564" role="img" aria-labelledby="title description" font-family="Arial, sans-serif">
  <title id="title">Escrever comentário</title>
  <desc id="description">Formulário com disciplina opcional, contador de caracteres, aviso de visibilidade e ações de publicar e cancelar.</desc>
  <rect x="0" y="0" width="400" height="564" rx="0" fill="#F2F4F7" stroke="none"/>
  <rect x="0" y="0" width="400" height="58" rx="0" fill="#174B83" stroke="none"/>
  <text x="16" y="37" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="start">AvaliaAi UnB</text>
  <text x="16" y="100" font-size="27" font-weight="700" fill="#202124" text-anchor="start">Escrever comentário</text>
  <text x="16" y="127" font-size="16" font-weight="400" fill="#4F5357" text-anchor="start">Professor de exemplo</text>
  <rect x="16" y="152" width="368" height="386" rx="12" fill="#FFFFFF" stroke="none"/>
  <text x="32" y="185" font-size="16" font-weight="700" fill="#202124" text-anchor="start">Disciplina (opcional)</text>
  <rect x="32" y="197" width="336" height="44" rx="8" fill="#FFFFFF" stroke="#767676"/>
  <text x="44" y="225" font-size="16" font-weight="400" fill="#202124" text-anchor="start">Selecionar disciplina</text>
  <text x="350" y="225" font-size="16" font-weight="700" fill="#4F5357" text-anchor="middle">⌄</text>
  <text x="32" y="270" font-size="16" font-weight="700" fill="#202124" text-anchor="start">Comentário</text>
  <rect x="32" y="282" width="336" height="92" rx="8" fill="#FFFFFF" stroke="#767676"/>
  <text x="44" y="312" font-size="15" font-weight="400" fill="#4F5357" text-anchor="start">Escreva sobre sua experiência.</text>
  <text x="32" y="399" font-size="14" font-weight="400" fill="#4F5357" text-anchor="start">10 a 1.000 caracteres</text>
  <text x="368" y="399" font-size="14" font-weight="400" fill="#4F5357" text-anchor="end">0 / 1.000</text>
  <text x="32" y="432" font-size="14" font-weight="400" fill="#4F5357" text-anchor="start">Seu texto e username ficarão públicos.</text>
  <rect x="32" y="469" width="144" height="44" rx="8" fill="#174B83" stroke="none"/>
  <text x="104" y="496" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">Publicar</text>
  <rect x="192" y="469" width="144" height="44" rx="8" fill="#FFFFFF" stroke="#174B83"/>
  <text x="264" y="496" font-size="15" font-weight="700" fill="#174B83" text-anchor="middle">Cancelar</text>
</svg>
