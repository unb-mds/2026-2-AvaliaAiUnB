site_name: AvaliaUnb
site_description: Documentação do AvaliaUnb
repo_url: https://github.com/unb-mds/2026-2-AvaliaAiUnB
repo_name: unb-mds/2026-2-AvaliaAiUnB
theme:
  name: material
  language: pt-BR
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: blue
      toggle:
        icon: material/weather-night
        name: Ativar modo escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: Ativar modo claro
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.tabs.link
    - search.highlight
extra_css:
  - stylesheets/extra.css
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
exclude_docs: |
  IMPLEMENTACAO_26_36_37.md
nav:
  - Início: index.md
  - Guia da documentação: GUIA_DOCUMENTACAO.md
  - Projeto:
    - Funcionalidades: FUNCIONALIDADES.md
    - Comentários avaliativos: COMENTARIOS.md
    - Design system: DESIGN_SYSTEM.md
    - Telas de comentários: TELAS_COMENTARIOS.md
    - Documento de Visão: DOCUMENTO_DE_VISAO.md
    - Contribuição (DoR e DoD): PROCESSO_CONTRIBUICAO.md
    - Board do Figma: "https://www.figma.com/board/PgqkPopVXOiSqm9gD5RRNv/AvaliaAi---Template-MDS?node-id=0-1"
  - Arquitetura:
    - Diagramas de Arquitetura: ARQUITETURA.md
    - Modelo de Dados: "Modelo de Dados.md"
  - Desenvolvimento:
    - Backend: BACKEND.md
    - Frontend: FRONTEND.md
    - Como Usar o Scraper: COMO_USAR_SCRAPER.md
    - Pipeline: pipeline.md
    - Hospedagem: HOSPEDAGEM.md
  - Segurança:
    - Cibersegurança: CIBERSEGURANCA.md
    - Auditoria de Segurança: AUDITORIA_SEGURANCA.md
